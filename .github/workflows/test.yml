name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # cache-nix-action purges superseded caches.
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, so everything is built once into the same store; the store is
  # cached across runs, so only what changed with the nix files or the lock
  # is fetched or built again.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', '.github/workflows/test.yml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      # GC roots for what the cache should keep: cache-nix-action collects
      # garbage down to gc-max-store-size before saving, which otherwise
      # deletes what the tests use.
      - name: Root cached outputs
        run: |
          mkdir -p "$RUNNER_TEMP/gcroots"
          nix build .#checks.x86_64-linux.default --out-link "$RUNNER_TEMP/gcroots/out"
          nix develop --profile "$RUNNER_TEMP/gcroots/dev" -c true

      # Ubuntu 24.04's AppArmor denies unprivileged user namespaces to
      # unconfined programs, which bwrap needs for the real-sandbox tests.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: make test
        # install-nix-action points TMPDIR at /home/runner/work/_temp, which
        # makes the tests' unix socket paths exceed the 108-byte limit.
        env:
          TMPDIR: /tmp
        run: make test
