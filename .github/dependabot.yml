version: 2
updates:
  # Bumps the SHA-pinned actions and their version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Skip releases younger than two weeks.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # Bumps flake.lock (nixpkgs). The packages inside - claude-code, gh, ... -
  # come from it for everyone on the flake's default package, so a stale
  # lock means stale tools.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
