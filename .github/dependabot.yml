version: 2
updates:
  # Bumps the SHA-pinned actions and their version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Bumps flake.lock (nixpkgs). What the sandbox runs and brings - bwrap,
  # pasta, nix, git, ... - comes from it for everyone on the flake's default
  # package, so a stale lock means stale tools.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly

  # Direct Go dependencies only; indirect ones follow through go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    groups:
      go:
        patterns: ["*"]
