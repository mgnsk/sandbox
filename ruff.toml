# The extension-less scripts in src/ are Python too.
extend-include = ["src/*"]
extend-exclude = ["src/__pycache__"]

[lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[lint.per-file-ignores]
# dbus-fast takes D-Bus type signatures as string annotations ("o", "ao", ...).
"src/secret-service-guard" = ["F722", "F821"]
